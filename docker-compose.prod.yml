version: '3.8'

services:
  nginx:
    image: nginx:alpine
    container_name: amal_prod_nginx
    restart: always
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ssl_certs:/etc/nginx/ssl:ro
    depends_on:
      - web
      - api
      - scholar
    networks:
      - amal_network

  postgres:
    image: pgvector/pgvector:pg16
    container_name: amal_prod_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-amal_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-amal_secure_production_db_pass_2026}
      POSTGRES_DB: ${POSTGRES_DB:-amal_prod_db}
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
      - ./packages/database/migrations:/docker-entrypoint-initdb.d
    networks:
      - amal_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-amal_admin} -d ${POSTGRES_DB:-amal_prod_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: amal_prod_redis
    restart: always
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-amal_redis_secure_pass_2026}
    volumes:
      - redisdata_prod:/data
    networks:
      - amal_network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-amal_redis_secure_pass_2026}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    container_name: amal_prod_api
    restart: always
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-amal_admin}:${POSTGRES_PASSWORD:-amal_secure_production_db_pass_2026}@postgres:5432/${POSTGRES_DB:-amal_prod_db}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD:-amal_redis_secure_pass_2026}@redis:6379
      JWT_SECRET: ${JWT_SECRET:-amal_prod_jwt_secret_key_long_secure_string_2026}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - amal_network

  ai:
    build:
      context: .
      dockerfile: services/ai/Dockerfile
    container_name: amal_prod_ai
    restart: always
    environment:
      NODE_ENV: production
      PORT: 4001
      REDIS_URL: redis://:${REDIS_PASSWORD:-amal_redis_secure_pass_2026}@redis:6379
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - amal_network

  retrieval:
    build:
      context: .
      dockerfile: services/retrieval/Dockerfile
    container_name: amal_prod_retrieval
    restart: always
    environment:
      NODE_ENV: production
      PORT: 4002
      DATABASE_URL: postgresql://${POSTGRES_USER:-amal_admin}:${POSTGRES_PASSWORD:-amal_secure_production_db_pass_2026}@postgres:5432/${POSTGRES_DB:-amal_prod_db}?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - amal_network

  worker:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    container_name: amal_prod_worker
    restart: always
    command: ["node", "services/api/dist/workers/daily-plan.worker.js"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-amal_admin}:${POSTGRES_PASSWORD:-amal_secure_production_db_pass_2026}@postgres:5432/${POSTGRES_DB:-amal_prod_db}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD:-amal_redis_secure_pass_2026}@redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - amal_network

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: amal_prod_web
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: https://api.amal.app/api/v1
    depends_on:
      - api
    networks:
      - amal_network

  scholar:
    build:
      context: .
      dockerfile: apps/scholar/Dockerfile
    container_name: amal_prod_scholar
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3002
      NEXT_PUBLIC_API_URL: https://api.amal.app/api/v1
    depends_on:
      - api
    networks:
      - amal_network

volumes:
  pgdata_prod:
  redisdata_prod:
  ssl_certs:

networks:
  amal_network:
    driver: bridge
