<svg width="512" height="512" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Imperial Emerald Gradient -->
    <linearGradient id="amalBgGrad" x1="10" y1="10" x2="90" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#064E3B"/>
      <stop offset="45%" stop-color="#043929"/>
      <stop offset="100%" stop-color="#022C22"/>
    </linearGradient>

    <!-- Royal Islamic Gold Bevel Gradient -->
    <linearGradient id="amalGoldGrad" x1="20" y1="12" x2="80" y2="88" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="30%" stop-color="#F59E0B"/>
      <stop offset="50%" stop-color="#D97706"/>
      <stop offset="80%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#92400E"/>
    </linearGradient>

    <!-- Pathway Warm Gold Gradient -->
    <linearGradient id="amalPathGrad" x1="50" y1="62" x2="50" y2="88" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <!-- Book Page Soft Radiance -->
    <linearGradient id="amalPageGrad" x1="50" y1="50" x2="50" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FDFBF7"/>
    </linearGradient>
  </defs>

  <!-- App Icon Squircle Container -->
  <rect x="2" y="2" width="96" height="96" rx="22" fill="url(#amalBgGrad)"/>
  <rect x="2.75" y="2.75" width="94.5" height="94.5" rx="21.25" stroke="url(#amalGoldGrad)" stroke-width="1.5" stroke-opacity="0.6"/>

  <!-- Outer Beveled Mihrab Arch Frame -->
  <path d="M50 14 C66 24 74 34 74 48 V80 C74 81.5 72.8 82.5 71.2 82.5 H28.8 C27.2 82.5 26 81.5 26 80 V48 C26 34 34 24 50 14 Z"
        fill="#043324"
        stroke="url(#amalGoldGrad)"
        stroke-width="3"
        stroke-linejoin="round"/>

  <!-- Inner Fine Arch Outline -->
  <path d="M50 17.5 C63.5 26 70.5 35 70.5 48 V79.5 H29.5 V48 C29.5 35 36.5 26 50 17.5 Z"
        fill="none"
        stroke="url(#amalGoldGrad)"
        stroke-width="0.8"
        stroke-opacity="0.7"/>

  <!-- Mosque Silhouette (Domes & Minarets) -->
  <!-- Left Minaret -->
  <path d="M34 46 V30 L35 28 L36 30 V46 Z" fill="#0D5C43" opacity="0.85"/>
  <rect x="33.5" y="34" width="3" height="1" fill="url(#amalGoldGrad)" opacity="0.8"/>
  <circle cx="35" cy="27.5" r="0.6" fill="#FEF08A"/>

  <!-- Right Minaret -->
  <path d="M64 46 V30 L65 28 L66 30 V46 Z" fill="#0D5C43" opacity="0.85"/>
  <rect x="63.5" y="34" width="3" height="1" fill="url(#amalGoldGrad)" opacity="0.8"/>
  <circle cx="65" cy="27.5" r="0.6" fill="#FEF08A"/>

  <!-- Minor Side Domes -->
  <path d="M37 46 C37 42 41 40 43 42 V46 Z" fill="#094A36" opacity="0.9"/>
  <path d="M57 46 C59 40 63 42 63 46 Z" fill="#094A36" opacity="0.9"/>

  <!-- Central Grand Mosque Dome -->
  <path d="M42 46 C42 38 46.5 34 50 33 C53.5 34 58 38 58 46 Z" fill="#0B523C"/>
  <path d="M49.5 33 V31.5 H50.5 V33 Z" fill="url(#amalGoldGrad)"/>
  <circle cx="50" cy="31" r="0.8" fill="#FEF08A"/>

  <!-- Celestial Crescent Moon & Star -->
  <path d="M52 20.5 C49 20.8 46.5 23.2 46.5 26.2 C46.5 29.4 49.1 32 52.3 32 C53.7 32 55 31.5 56 30.6 C55 32.4 52.8 33.6 50.4 33.6 C46.8 33.6 44 30.8 44 27.2 C44 23.6 46.8 20.8 50.4 20.8 C51 20.8 51.5 20.9 52 20.5 Z"
        fill="url(#amalGoldGrad)"/>
  <!-- 5-Pointed Star -->
  <path d="M53.5 22.5 L54.1 23.8 L55.5 24 L54.4 25 L54.7 26.4 L53.5 25.7 L52.3 26.4 L52.6 25 L51.5 24 L52.9 23.8 Z"
        fill="#FEF08A"/>

  <!-- Winding Golden Pathway ("Tariq") flowing outward -->
  <path d="M50 63 C48 68 44 71 45 76 C46 80 48 81 44 86 H56 C57 82 54 79 55 76 C56 71 52 68 50 63 Z"
        fill="url(#amalPathGrad)"/>

  <!-- Rehal (Crossed Book Stand) Base -->
  <path d="M37 63 L46 58 M63 63 L54 58" stroke="url(#amalGoldGrad)" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M42 65 L58 65" stroke="url(#amalGoldGrad)" stroke-width="1.4" stroke-linecap="round" opacity="0.85"/>

  <!-- Open Holy Quran / Mushaf -->
  <!-- Left Page -->
  <path d="M50 53 C43 50.5 35 51.5 31 53.5 C31 54 31.2 60 31.5 61 C35.5 59 43 58 50 61 Z"
        fill="url(#amalPageGrad)"
        stroke="url(#amalGoldGrad)"
        stroke-width="1.2"
        stroke-linejoin="round"/>
  <!-- Right Page -->
  <path d="M50 53 C57 50.5 65 51.5 69 53.5 C69 54 68.8 60 68.5 61 C64.5 59 57 58 50 61 Z"
        fill="url(#amalPageGrad)"
        stroke="url(#amalGoldGrad)"
        stroke-width="1.2"
        stroke-linejoin="round"/>

  <!-- Quran Spine -->
  <path d="M50 53 V61" stroke="#92400E" stroke-width="1.4" stroke-linecap="round"/>

  <!-- Page Script Lines (Subtle Sacred Inscription) -->
  <line x1="35" y1="54.8" x2="46" y2="53.8" stroke="#D97706" stroke-width="0.7" stroke-linecap="round" opacity="0.6"/>
  <line x1="34" y1="56.8" x2="47" y2="55.8" stroke="#D97706" stroke-width="0.7" stroke-linecap="round" opacity="0.6"/>
  <line x1="35" y1="58.8" x2="46" y2="57.8" stroke="#D97706" stroke-width="0.7" stroke-linecap="round" opacity="0.6"/>

  <line x1="54" y1="53.8" x2="65" y2="54.8" stroke="#D97706" stroke-width="0.7" stroke-linecap="round" opacity="0.6"/>
  <line x1="53" y1="55.8" x2="66" y2="56.8" stroke="#D97706" stroke-width="0.7" stroke-linecap="round" opacity="0.6"/>
  <line x1="54" y1="57.8" x2="65" y2="58.8" stroke="#D97706" stroke-width="0.7" stroke-linecap="round" opacity="0.6"/>

  <!-- Delicate Golden Sprout / Olive Branch emerging on the right -->
  <path d="M68 55 C70 52 73 50 74 46" stroke="url(#amalGoldGrad)" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Leaf 1 -->
  <path d="M74 46 C77 46 78 43 78 41 C76 41 73 43 74 46 Z" fill="url(#amalGoldGrad)"/>
  <!-- Leaf 2 -->
  <path d="M70.5 51 C73.5 50.5 74.5 48.5 74 47 C72 47.5 70 49 70.5 51 Z" fill="url(#amalGoldGrad)"/>

  <!-- Apex Golden Finial (Top of Arch) -->
  <circle cx="50" cy="11.5" r="1.6" fill="url(#amalGoldGrad)"/>
  <circle cx="50" cy="11.5" r="0.8" fill="#FEF08A"/>
</svg>
